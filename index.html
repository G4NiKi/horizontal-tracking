<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水平トラッキング練習</title>
<meta name="description" content="FPS のエイム練習用。マウスを水平に往復させた軌跡を分析し、姿勢や構えのクセを指摘します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<main>
  <h1>水平トラッキング練習</h1>
  <p class="lead">ガイド線に沿ってマウスを左右に往復させます。往復ごとに軌跡を分析し、ズレ方のクセから姿勢や構えの見直しポイントを提案します。</p>

  <div class="controls">
    <label>感度倍率 <input type="range" id="sens" min="0.2" max="3" step="0.1" value="1"> <output id="sensOut">1.0</output></label>
    <label>利き手
      <select id="hand"><option value="right">右手</option><option value="left">左手</option></select>
    </label>
    <button id="reset">記録をリセット</button>
  </div>

  <div class="stage">
    <canvas id="cv" tabindex="0" aria-label="練習エリア。クリックで開始"></canvas>
    <div class="overlay" id="ov"><div id="ovText">クリックして開始<br>Space で線に戻る / Esc で終了</div></div>
  </div>

  <div class="cols">
    <section>
      <h2>計測値</h2>
      <div class="tablewrap" id="stats"><p class="empty">まだ記録がありません。</p></div>
    </section>
    <section>
      <h2>アドバイス</h2>
      <div id="advice"><p class="empty">左右に6往復ほどすると、クセの分析が表示されます。</p></div>
    </section>
  </div>

  <p class="note">感度倍率は、ゲーム内で同じ距離を振ったときと同じくらいの振り幅になるよう合わせてください。ブラウザがマウスのロックを許可しない環境では通常のカーソル位置で計測するため、OS のカーソル加速の影響を受けます。アドバイスは軌跡の形から推定した目安です。</p>
</main>
<noscript><p class="note">このツールの動作には JavaScript が必要です。</p></noscript>
</body>
</html>
